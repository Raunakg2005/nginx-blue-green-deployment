services:
  app-blue:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app-blue
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - APP_ENV=blue
      - APP_VERSION=${APP_VERSION:-v1.0.0}
      - SIMULATE_FAILURE=${SIMULATE_FAILURE_BLUE:-false}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  app-green:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app-green
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - APP_ENV=green
      - APP_VERSION=${APP_VERSION:-v1.0.0}
      - SIMULATE_FAILURE=${SIMULATE_FAILURE_GREEN:-false}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:rw
    networks:
      - app-network
    depends_on:
      - app-blue

networks:
  app-network:
    name: app-network
    driver: bridge
