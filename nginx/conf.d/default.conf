# ==============================================================================
# Dynamic Reverse Proxy Server Definition
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Timeouts tuned for resilient upstream switching
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Automatic upstream retry on transient connection resets during container swap
    proxy_next_upstream error timeout invalid_header http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 5s;

    # Reverse proxy routing to active upstream pool
    location / {
        proxy_pass http://active_app;
        
        # HTTP 1.1 for persistent connection reuse to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard client identity headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for real-time responsiveness
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # Nginx Proxy Health Check Probe
    location /nginx-health {
        access_log off;
        return 200 '{"status":"UP","component":"nginx-reverse-proxy"}\n';
        add_header Content-Type application/json;
    }
}
